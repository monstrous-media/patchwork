name: Release
on:
  push:
    tags: ['v*']

# Uses the monstrous-media organisation secrets:
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
# When they are absent (forks), the release is built unsigned.

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write        # upload release assets
      id-token: write        # OIDC token for Sigstore signing of the provenance attestation
      attestations: write    # store the attestation on the repository
    env:
      # `secrets` can't be used in a step's `if:`; expose presence as plain env values instead.
      HAVE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAVE_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: Tests
        run: swift test 2>&1 | tail -5

      - name: Import Developer ID certificate
        if: env.HAVE_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm -f cert.p12
          echo "SIGN_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"

      - name: Store notarisation credentials
        if: env.HAVE_CERT == 'true' && env.HAVE_NOTARY == 'true'
        run: |
          xcrun notarytool store-credentials ci-notary \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_PASSWORD }}"
          echo "NOTARY_PROFILE=ci-notary" >> "$GITHUB_ENV"

      - name: Build app (signed + notarised when credentials are present)
        run: VERSION="${GITHUB_REF_NAME#v}" tools/make-app.sh

      - name: Package CLI
        run: (cd dist && tar -czf "patchwork-cli-${GITHUB_REF_NAME#v}-macos.tar.gz" patchwork)

      # SLSA build provenance: records that these exact bytes were built by this workflow from this
      # commit. Anyone can check a download with `gh attestation verify <file> --repo monstrous-media/patchwork`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Patchwork-*.zip
            dist/patchwork-cli-*.tar.gz

      - name: Release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## " v "( |$)" {p=1; next} /^## / {p=0} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG section for $v" > notes.md; fi
          printf '\n---\n`Patchwork-%s.zip` is signed and notarised; unzip and drag to Applications. `patchwork-cli-%s-macos.tar.gz` is the command-line tool.\n' "$v" "$v" >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/Patchwork-*.zip
            dist/patchwork-cli-*.tar.gz
          body_path: notes.md
