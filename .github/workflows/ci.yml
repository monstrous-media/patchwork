name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build and test
        run: swift test 2>&1 | tail -20
      - name: Build release products
        run: swift build -c release
      - name: CLI refuses to write to the M1 without --yes when not interactive
        run: |
          set +e
          out=$(.build/release/patchwork write 5 </dev/null 2>&1); code=$?
          set -e
          echo "exit $code: $out"
          test "$code" -eq 2 && grep -q -- "without --yes" <<<"$out"
          # With --yes the guard is passed and the command fails later, on the missing interface, not on consent;
          # --yes before the positional must not swallow it.
          set +e
          out=$(.build/release/patchwork restore --yes examples/glass-pad.json --slot 3 </dev/null 2>&1); code=$?
          set -e
          echo "exit $code: $out"
          test "$code" -ne 2 && ! grep -q -- "without --yes" <<<"$out" && grep -q -- "MIDI" <<<"$out"
      - name: Assemble app (unsigned)
        run: tools/make-app.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Patchwork-unsigned
          path: dist/Patchwork-*.zip

  linux:
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Core tests (no Apple frameworks)
        run: swift test --filter PatchworkCoreTests 2>&1 | tail -20

      # IH-02: fuzz the SysEx parser and the 7-in-8 unpacker with libFuzzer + ASan for two minutes,
      # seeded from the test vectors. Any crash/timeout input lands in fuzz/artifacts and is uploaded.
      - name: Build fuzz target (libFuzzer + ASan)
        run: swift build -c release -Xswiftc -sanitize=fuzzer,address -Xswiftc -parse-as-library -Xswiftc -DFUZZING --product FuzzSysEx
      - name: Fuzz SysEx parser for 120 s
        env:
          ASAN_OPTIONS: detect_leaks=0     # LeakSanitizer needs ptrace, which the container lacks
        run: |
          mkdir -p fuzz/corpus fuzz/artifacts
          cp Tests/PatchworkCoreTests/Vectors/* fuzz/corpus/
          .build/release/FuzzSysEx -max_total_time=120 -max_len=20000 -timeout=10 \
            -artifact_prefix=fuzz/artifacts/ -print_final_stats=1 fuzz/corpus
      - name: Upload fuzz crash artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
